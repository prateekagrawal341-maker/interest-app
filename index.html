<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interest Calculator</title>

<style>
body {
  font-family: 'Segoe UI';
  background: #f1f5f9;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: auto;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}
input, select {
  padding: 10px;
  width: 100%;
}
button {
  padding: 10px;
  margin-top: 10px;
  background: blue;
  color: white;
  border: none;
}
.result {
  background: #eef;
  padding: 10px;
}
</style>
</head>

<body>

<div class="container">

<h2>Interest Calculator</h2>

<div class="card">
<div class="grid">

<div>
<label>Lending Date</label>
<input type="date" id="start">
</div>

<div>
<label>Return Date</label>
<input type="date" id="end">
</div>

<div>
<label>Principal (Lakhs)</label>
<input type="number" id="principal">
</div>

<div>
<label>Interest Rate</label>
<select id="rate">
<option value="0.12">12%</option>
<option value="0.18">18%</option>
<option value="0.24">24%</option>
</select>
</div>

<div>
<label>Interest Type</label>
<select id="type">
<option value="simple">Simple Interest</option>
<option value="compound">Compound Interest</option>
</select>
</div>

<div class="result">Interest: ₹ <span id="interest">0</span></div>
<div class="result">Monthly: ₹ <span id="monthly">0</span></div>
<div class="result">Total: ₹ <span id="totalYear">0</span></div>

</div>

<button onclick="calculate()">Calculate</button>
</div>

</div>

<script>

function calculate() {

  let start = new Date(document.getElementById("start").value);
  let end = new Date(document.getElementById("end").value);

  if (!document.getElementById("start").value || !document.getElementById("end").value) {
    alert("Select dates");
    return;
  }

  let days = (end - start) / (1000*60*60*24);
  if (days <= 0) {
    alert("Invalid date");
    return;
  }

  let years = days / 365;

  let input = document.getElementById("principal").value.trim();

  if (input === "") {
    alert("Enter principal");
    return;
  }

  let p = parseFloat(input);

  if (isNaN(p) || p <= 0) {
    alert("Invalid principal");
    return;
  }

  let principal = p * 100000;
  let rate = parseFloat(document.getElementById("rate").value);
  let type = document.getElementById("type").value;

  let interest;

  if (type === "simple") {
    interest = principal * rate * years;
  } else {
    let amount = principal * Math.pow((1 + rate), years);
    interest = amount - principal;
  }

  let monthly = interest / 12;

  document.getElementById("interest").innerText = interest.toFixed(0);
  document.getElementById("monthly").innerText = monthly.toFixed(0);
  document.getElementById("totalYear").innerText = (principal + interest).toFixed(0);
}

</script>

</body>
</html>
