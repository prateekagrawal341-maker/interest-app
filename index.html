<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Tracker</title>

<style>
body {
  font-family: 'Segoe UI';
  background: #0f172a;
  color: white;
  margin: 0;
}

.header {
  background: linear-gradient(135deg,#2563eb,#9333ea);
  padding: 15px;
  text-align: center;
  font-weight: bold;
}

.container {
  padding: 15px;
  padding-bottom: 80px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 15px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #2563eb;
  color: white;
}

table button {
  width: auto;
  padding: 6px 10px;
}

table {
  width:100%;
  border-collapse: collapse;
}

th, td {
  padding:8px;
  border-bottom:1px solid #334155;
  text-align:center;
}

tr:hover {
  background: #334155;
}

.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: #1e293b;
}

.nav button {
  flex:1;
  background:none;
  border:none;
  color:#cbd5f5;
  padding:10px;
}

.nav button.active {
  color:white;
}
</style>
</head>

<body>

<div class="header">Finance Tracker</div>

<div class="container">

<!-- HOME -->
<div id="home">

<div class="card">

<label>Name</label>
<input type="text" id="name">

<label>Start Date</label>
<input type="date" id="start">

<label>End Date</label>
<input type="date" id="end">

<label>Principal (Lakhs)</label>
<input type="number" id="principal">

<label>Rate</label>
<select id="rate">
<option value="0.12">12%</option>
<option value="0.18">18%</option>
<option value="0.24">24%</option>
</select>

<label>Interest Type</label>
<select id="type">
<option value="simple">Simple</option>
<option value="compound">Compound</option>
</select>

<label>Status</label>
<select id="status">
<option value="pending">Pending</option>
<option value="paid">Paid</option>
</select>

<button onclick="calculate()">Calculate</button>
<button onclick="addEntry()">Add Entry</button>

</div>

<div class="card">
Interest ₹ <span id="interest">0</span><br>
Monthly ₹ <span id="monthly">0</span><br>
Total ₹ <span id="total">0</span>
</div>

</div>

<!-- RECORDS -->
<div id="records" style="display:none">
<div class="card">
<table>
<thead>
<tr>
<th>Name</th>
<th>P</th>
<th>Type</th>
<th>Status</th>
<th>Total</th>
<th>X</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="showPage('home',this)" class="active">Home</button>
<button onclick="showPage('records',this)">Records</button>
</div>

<script>

let data = JSON.parse(localStorage.getItem("financeData")) || [];

function saveData(){
localStorage.setItem("financeData", JSON.stringify(data));
}

function showPage(page,btn){
["home","records"].forEach(p=>{
document.getElementById(p).style.display="none";
});
document.getElementById(page).style.display="block";

document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
}

function calculate(){

let p = parseFloat(document.getElementById("principal").value || 0);
let rate = parseFloat(document.getElementById("rate").value);
let type = document.getElementById("type").value;

let start = new Date(document.getElementById("start").value);
let end = new Date(document.getElementById("end").value);

let years = (end - start) / (1000*60*60*24*365);
if(isNaN(years) || years <= 0) return alert("Invalid dates");

let principalAmt = p * 100000;
let interest;

if(type === "compound"){
  interest = principalAmt * Math.pow((1 + rate), years) - principalAmt;
}else{
  interest = principalAmt * rate * years;
}

let monthly = interest / (years * 12);

document.getElementById("interest").innerText = interest.toFixed(0);
document.getElementById("monthly").innerText = monthly.toFixed(0);
document.getElementById("total").innerText = (principalAmt + interest).toFixed(0);

}

function addEntry(){

let record={
name: document.getElementById("name").value || "No Name",
principal: parseFloat(document.getElementById("principal").value || 0),
type: document.getElementById("type").value,
status: document.getElementById("status").value,
total: parseFloat(document.getElementById("total").innerText || 0)
};

data.push(record);
saveData();
render();

}

function render(){

let table=document.getElementById("table");
table.innerHTML="";

data.forEach((r,i)=>{
table.innerHTML+=`
<tr>
<td>${r.name}</td>
<td>${r.principal}</td>
<td>${r.type}</td>
<td style="color:${r.status==='paid'?'#22c55e':'#f59e0b'}">${r.status}</td>
<td>${r.total}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`;
});

}

function del(i){
data.splice(i,1);
saveData();
render();
}

render();

</script>

</body>
</html>
