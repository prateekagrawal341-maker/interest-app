<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance App</title>

<!-- Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>

body {
  font-family: 'Segoe UI';
  background: #0f172a;
  color: white;
  margin: 0;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  background: linear-gradient(135deg,#2563eb,#9333ea);
  padding: 15px;
  text-align: center;
  font-weight: bold;
  font-size: 18px;
}

/* CONTAINER */
.container {
  padding: 15px;
  padding-bottom: 80px;
}

/* CARD */
.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  animation: fadeIn 0.4s ease;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 13px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #2563eb;
  color: white;
  font-size: 15px;
  transition: 0.2s;
}

button:active {
  transform: scale(0.96);
}

/* STATS */
.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}

.stat {
  background: #2563eb;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

.stat span {
  display:block;
  font-size:18px;
  font-weight:bold;
}

/* TABLE */
table {
  width:100%;
  border-collapse: collapse;
}

th, td {
  padding:8px;
  border-bottom:1px solid #334155;
  text-align:center;
}

/* NAVBAR */
.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: #1e293b;
  border-top: 1px solid #334155;
}

.nav button {
  flex:1;
  background:none;
  border:none;
  color:#cbd5f5;
  padding:10px;
  font-size:12px;
}

.nav button.active {
  color:white;
}

/* ICON */
.icon {
  display:block;
  font-size:22px;
}

/* ANIMATION */
@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<div class="header">Finance App</div>

<div class="container">

<!-- HOME -->
<div id="home">

<div class="card">
<label>Start Date</label>
<input type="date" id="start">

<label>End Date</label>
<input type="date" id="end">

<label>Principal (Lakhs)</label>
<input type="number" id="principal">

<label>Rate</label>
<select id="rate">
<option value="0.12">12%</option>
<option value="0.18">18%</option>
<option value="0.24">24%</option>
</select>

<label>Type</label>
<select id="type">
<option value="simple">Simple</option>
<option value="compound">Compound</option>
</select>

<label>Compounding</label>
<select id="compoundType">
<option value="yearly">Yearly</option>
<option value="monthly">Monthly</option>
</select>

<button onclick="calculate()">Calculate</button>
<button onclick="addEntry()">Add Entry</button>

</div>

<div class="card">
<h3>Result</h3>
Interest ₹ <span id="interest">0</span><br>
Monthly ₹ <span id="monthly">0</span><br>
Total ₹ <span id="totalYear">0</span>
</div>

</div>

<!-- RECORDS -->
<div id="records" style="display:none">
<div class="card">
<table>
<thead>
<tr>
<th>P</th><th>Type</th><th>Int</th><th>Total</th><th>X</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>
</div>

<!-- SUMMARY -->
<div id="summary" style="display:none">

<div class="stats">
<div class="stat">Invest<span id="totalInvest">0</span></div>
<div class="stat">Interest<span id="totalInterest">0</span></div>
<div class="stat">Return<span id="totalReturn">0</span></div>
</div>

<canvas id="chart" width="300" height="200"></canvas>

</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="showPage('home', this)" class="active">
<span class="material-icons icon">home</span>
Home
</button>

<button onclick="showPage('records', this)">
<span class="material-icons icon">list</span>
Records
</button>

<button onclick="showPage('summary', this)">
<span class="material-icons icon">analytics</span>
Summary
</button>
</div>

<script>

let data = JSON.parse(localStorage.getItem("financeData")) || [];

function saveData(){
  localStorage.setItem("financeData", JSON.stringify(data));
}

function showPage(page, btn){

["home","records","summary"].forEach(p=>{
document.getElementById(p).style.display="none";
});

document.getElementById(page).style.display="block";

document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
}

function calculate(){

let p=parseFloat(document.getElementById("principal").value);
if(!p) return alert("Enter principal");

let principalAmt=p*100000;

let rate=parseFloat(document.getElementById("rate").value);
let type=document.getElementById("type").value;
let compType=document.getElementById("compoundType").value;

let startDate=new Date(document.getElementById("start").value);
let endDate=new Date(document.getElementById("end").value);

let years=(endDate-startDate)/(1000*60*60*24*365);
if(isNaN(years)||years<=0) return alert("Invalid dates");

let interest;

if(type==="compound"){
if(compType==="monthly"){
let n=12;
interest=principalAmt*Math.pow(1+rate/n,n*years)-principalAmt;
}else{
interest=principalAmt*Math.pow(1+rate,years)-principalAmt;
}
}else{
interest=principalAmt*rate*years;
}

document.getElementById("interest").innerText=interest.toFixed(0);
document.getElementById("monthly").innerText=(interest/12).toFixed(0);
document.getElementById("totalYear").innerText=(principalAmt+interest).toFixed(0);

}

function addEntry(){

let record={
principal:parseFloat(document.getElementById("principal").value),
type:document.getElementById("type").value,
interest:parseFloat(document.getElementById("interest").innerText),
total:parseFloat(document.getElementById("totalYear").innerText)
};

data.push(record);
saveData();
render();

}

function render(){

let table=document.getElementById("table");
table.innerHTML="";

let ti=0,ti2=0,tr=0;

data.forEach((r,i)=>{
table.innerHTML+=`
<tr>
<td>${r.principal}</td>
<td>${r.type}</td>
<td>${r.interest}</td>
<td>${r.total}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`;

ti+=r.principal*100000;
ti2+=r.interest;
tr+=r.total;
});

document.getElementById("totalInvest").innerText=ti.toFixed(0);
document.getElementById("totalInterest").innerText=ti2.toFixed(0);
document.getElementById("totalReturn").innerText=tr.toFixed(0);

drawChart(ti,ti2);

}

function del(i){
data.splice(i,1);
saveData();
render();
}

function drawChart(invest,interest){

let ctx=document.getElementById("chart").getContext("2d");

ctx.clearRect(0,0,300,200);

let total=invest+interest;
if(total===0) return;

let investH=(invest/total)*150;
let intH=(interest/total)*150;

ctx.fillStyle="#2563eb";
ctx.fillRect(50,200-investH,50,investH);

ctx.fillStyle="#22c55e";
ctx.fillRect(150,200-intH,50,intH);

ctx.fillStyle="white";
ctx.fillText("Invest",50,190);
ctx.fillText("Profit",150,190);
}

render();

</script>

</body>
</html>
