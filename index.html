<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance App</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body {
  font-family: 'Segoe UI';
  background: #0f172a;
  color: white;
  margin: 0;
}

.header {
  position: sticky;
  top: 0;
  background: linear-gradient(135deg,#2563eb,#9333ea);
  padding: 15px;
  text-align: center;
  font-weight: bold;
}

.container {
  padding: 15px;
  padding-bottom: 80px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 15px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #2563eb;
  color: white;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

.stat {
  background: #2563eb;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

.stat span {
  display:block;
  font-size:18px;
  font-weight:bold;
}

table {
  width:100%;
  border-collapse: collapse;
}

th, td {
  padding:8px;
  border-bottom:1px solid #334155;
  text-align:center;
}

.overdue {
  background: #7f1d1d !important;
}

.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: #1e293b;
}

.nav button {
  flex:1;
  background:none;
  border:none;
  color:#cbd5f5;
  padding:10px;
}

.nav button.active {
  color:white;
}
</style>
</head>

<body>

<div class="header">Finance Tracker</div>

<div class="container">

<!-- HOME -->
<div id="home">

<div class="card">

<label>Name (optional)</label>
<input type="text" id="name">

<label>Start Date</label>
<input type="date" id="start">

<label>End Date</label>
<input type="date" id="end">

<label>Principal (Lakhs)</label>
<input type="number" id="principal">

<label>Rate</label>
<select id="rate">
<option value="0.12">12%</option>
<option value="0.18">18%</option>
<option value="0.24">24%</option>
</select>

<label>Status</label>
<select id="status">
<option value="pending">Pending</option>
<option value="paid">Paid</option>
</select>

<button onclick="calculate()">Calculate</button>
<button onclick="addEntry()">Add Entry</button>

</div>

<div class="card">
Interest ₹ <span id="interest">0</span><br>
Total ₹ <span id="total">0</span>
</div>

</div>

<!-- RECORDS -->
<div id="records" style="display:none">
<div class="card">
<table>
<thead>
<tr>
<th>Name</th>
<th>P</th>
<th>Status</th>
<th>Total</th>
<th>X</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>
</div>

<!-- SUMMARY -->
<div id="summary" style="display:none">

<div class="stats">
<div class="stat">Pending ₹ <span id="pendingAmt">0</span></div>
<div class="stat">Paid ₹ <span id="paidAmt">0</span></div>
<div class="stat">Total Invest ₹ <span id="totalInvest">0</span></div>
<div class="stat">Total Return ₹ <span id="totalReturn">0</span></div>
</div>

</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="showPage('home',this)" class="active">Home</button>
<button onclick="showPage('records',this)">Records</button>
<button onclick="showPage('summary',this)">Summary</button>
</div>

<script>

let data = JSON.parse(localStorage.getItem("financeData")) || [];

function saveData(){
localStorage.setItem("financeData", JSON.stringify(data));
}

function showPage(page,btn){
["home","records","summary"].forEach(p=>{
document.getElementById(p).style.display="none";
});
document.getElementById(page).style.display="block";

document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
}

function calculate(){

let p=parseFloat(principal.value || 0);
let rate=parseFloat(rateEl.value || 0.12);

let interest = p*100000*rate;

document.getElementById("interest").innerText=interest.toFixed(0);
document.getElementById("total").innerText=(p*100000+interest).toFixed(0);

}

function addEntry(){

let record={
name:name.value || "No Name",
principal:parseFloat(principal.value || 0),
status:status.value,
total:parseFloat(document.getElementById("total").innerText || 0),
end:end.value
};

data.push(record);
saveData();
render();

}

function render(){

let table=document.getElementById("table");
table.innerHTML="";

let pending=0,paid=0,totalInvest=0,totalReturn=0;

let today=new Date();

data.forEach((r,i)=>{

let overdueClass="";
if(r.status==="pending" && r.end && new Date(r.end)<today){
overdueClass="overdue";
}

table.innerHTML+=`
<tr class="${overdueClass}">
<td>${r.name}</td>
<td>${r.principal}</td>
<td>${r.status}</td>
<td>${r.total}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`;

totalInvest += r.principal*100000;
totalReturn += r.total;

if(r.status==="pending") pending+=r.total;
else paid+=r.total;

});

pendingAmt.innerText=pending.toFixed(0);
paidAmt.innerText=paid.toFixed(0);
totalInvest.innerText=totalInvest.toFixed(0);
totalReturn.innerText=totalReturn.toFixed(0);

}

function del(i){
data.splice(i,1);
saveData();
render();
}

let rateEl=document.getElementById("rate");

render();

</script>

</body>
</html>
