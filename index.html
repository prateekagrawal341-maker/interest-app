<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance App</title>

<style>
body {
  font-family: 'Segoe UI';
  background: #0f172a;
  color: white;
  margin: 0;
}

.header {
  position: sticky;
  top: 0;
  background: linear-gradient(135deg,#2563eb,#9333ea);
  padding: 15px;
  text-align: center;
  font-weight: bold;
}

.container {
  padding: 15px;
  padding-bottom: 70px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  background: #2563eb;
  color: white;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}

.stat {
  background: #2563eb;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

.stat span {
  display:block;
  font-size:18px;
  font-weight:bold;
}

table {
  width:100%;
  border-collapse: collapse;
}

th, td {
  padding:8px;
  border-bottom:1px solid #334155;
  text-align:center;
}

.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: #1e293b;
}

.nav button {
  flex:1;
  background:none;
  border:none;
  color:white;
  padding:12px;
}
</style>
</head>

<body>

<div class="header">Finance App</div>

<div class="container">

<!-- HOME -->
<div id="home">

<div class="card">
<label>Start Date</label>
<input type="date" id="start">

<label>End Date</label>
<input type="date" id="end">

<label>Principal (Lakhs)</label>
<input type="number" id="principal">

<label>Rate</label>
<select id="rate">
<option value="0.12">12%</option>
<option value="0.18">18%</option>
<option value="0.24">24%</option>
</select>

<label>Type</label>
<select id="type">
<option value="simple">Simple</option>
<option value="compound">Compound</option>
</select>

<label>Compounding</label>
<select id="compoundType">
<option value="yearly">Yearly</option>
<option value="monthly">Monthly</option>
</select>

<button onclick="calculate()">Calculate</button>
<button onclick="addEntry()">Add Entry</button>

</div>

<div class="card">
<h3>Result</h3>
Interest ₹ <span id="interest">0</span><br>
Monthly ₹ <span id="monthly">0</span><br>
Total ₹ <span id="totalYear">0</span>
</div>

</div>

<!-- RECORDS -->
<div id="records" style="display:none">
<div class="card">
<table>
<thead>
<tr>
<th>P</th><th>Type</th><th>Int</th><th>Total</th><th>X</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>
</div>

<!-- SUMMARY -->
<div id="summary" style="display:none">

<div class="stats">
<div class="stat">Invest<span id="totalInvest">0</span></div>
<div class="stat">Interest<span id="totalInterest">0</span></div>
<div class="stat">Return<span id="totalReturn">0</span></div>
</div>

<canvas id="chart" width="300" height="200"></canvas>

</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('records')">Records</button>
<button onclick="show('summary')">Summary</button>
</div>

<script>

let data = JSON.parse(localStorage.getItem("financeData")) || [];

function saveData(){
  localStorage.setItem("financeData", JSON.stringify(data));
}

function show(page){
  home.style.display="none";
  records.style.display="none";
  summary.style.display="none";
  document.getElementById(page).style.display="block";
}

function calculate(){

let p=parseFloat(principal.value);
if(!p) return alert("Enter principal");

let principalAmt=p*100000;

let rate=parseFloat(rate.value);
let type=document.getElementById("type").value;
let compType=document.getElementById("compoundType").value;

let startDate=new Date(start.value);
let endDate=new Date(end.value);

let years=(endDate-startDate)/(1000*60*60*24*365);
if(isNaN(years)||years<=0) return alert("Invalid dates");

let interest;

if(type==="compound"){
if(compType==="monthly"){
let n=12;
interest=principalAmt*Math.pow(1+rate/n,n*years)-principalAmt;
}else{
interest=principalAmt*Math.pow(1+rate,years)-principalAmt;
}
}else{
interest=principalAmt*rate*years;
}

interestEl.innerText=interest.toFixed(0);
monthly.innerText=(interest/12).toFixed(0);
totalYear.innerText=(principalAmt+interest).toFixed(0);

}

function addEntry(){

let record={
principal:parseFloat(principal.value),
type:type.value,
interest:parseFloat(interestEl.innerText),
total:parseFloat(totalYear.innerText)
};

data.push(record);
saveData();
render();

}

function render(){

table.innerHTML="";

let ti=0,ti2=0,tr=0;

data.forEach((r,i)=>{
table.innerHTML+=`
<tr>
<td>${r.principal}</td>
<td>${r.type}</td>
<td>${r.interest}</td>
<td>${r.total}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`;

ti+=r.principal*100000;
ti2+=r.interest;
tr+=r.total;
});

totalInvest.innerText=ti.toFixed(0);
totalInterest.innerText=ti2.toFixed(0);
totalReturn.innerText=tr.toFixed(0);

drawChart(ti,ti2);

}

function del(i){
data.splice(i,1);
saveData();
render();
}

function drawChart(invest,interest){

let ctx = document.getElementById("chart").getContext("2d");

ctx.clearRect(0,0,300,200);

let total=invest+interest;

let investH=(invest/total)*150;
let intH=(interest/total)*150;

ctx.fillStyle="#2563eb";
ctx.fillRect(50,200-investH,50,investH);

ctx.fillStyle="#22c55e";
ctx.fillRect(150,200-intH,50,intH);

ctx.fillStyle="white";
ctx.fillText("Invest",50,190);
ctx.fillText("Profit",150,190);
}

// shortcuts
let interestEl=document.getElementById("interest");

// load data
render();

</script>

</body>
</html>
