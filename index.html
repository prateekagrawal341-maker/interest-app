<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Finance App</title>

<style>
body {
  font-family: 'Segoe UI';
  background: #0f172a;
  color: white;
  margin: 0;
}

.header {
  padding: 20px;
  background: linear-gradient(135deg,#2563eb,#9333ea);
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
}

input, select {
  padding: 12px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #2563eb;
  color: white;
  margin-top: 10px;
  cursor: pointer;
}

.stats {
  display: flex;
  gap: 15px;
  margin-bottom: 20px;
}

.stat {
  flex:1;
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}

table {
  width:100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #334155;
  text-align: center;
}

</style>
</head>

<body>

<div class="header">Finance Interest App</div>

<div class="container">

<div class="stats">
<div class="stat">Investment<br>₹ <span id="totalInvest">0</span></div>
<div class="stat">Interest<br>₹ <span id="totalInterest">0</span></div>
<div class="stat">Returns<br>₹ <span id="totalReturn">0</span></div>
</div>

<div class="card">
<div class="grid">

<input type="date" id="start">
<input type="date" id="end">

<input type="number" id="principal" placeholder="Principal (Lakhs)">

<select id="rate">
<option value="0.12">12%</option>
<option value="0.18">18%</option>
<option value="0.24">24%</option>
</select>

<select id="type">
<option value="simple">Simple</option>
<option value="compound">Compound</option>
</select>

<select id="compoundType">
<option value="yearly">Yearly</option>
<option value="monthly">Monthly</option>
</select>

</div>

<button onclick="calculate()">Calculate</button>
<button onclick="addEntry()">Add Entry</button>

<div>
Interest: ₹ <span id="interest">0</span><br>
Monthly: ₹ <span id="monthly">0</span><br>
Total: ₹ <span id="totalYear">0</span>
</div>

</div>

<div class="card">

<button onclick="exportData()">Export</button>

<table>
<thead>
<tr>
<th>Principal</th>
<th>Type</th>
<th>Interest</th>
<th>Total</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>

</table>

</div>

</div>

<script>

let data = [];

function calculate(){

let p = parseFloat(document.getElementById("principal").value);
if(!p) return alert("Enter principal");

let principal = p * 100000;

let rate = parseFloat(document.getElementById("rate").value);
let type = document.getElementById("type").value;
let compType = document.getElementById("compoundType").value;

let start = new Date(document.getElementById("start").value);
let end = new Date(document.getElementById("end").value);

let years = (end - start)/(1000*60*60*24*365);

let interest;

if(type==="compound"){
  if(compType==="monthly"){
    let n=12;
    let amount = principal * Math.pow(1 + rate/n, n*years);
    interest = amount - principal;
  } else {
    let amount = principal * Math.pow(1 + rate, years);
    interest = amount - principal;
  }
} else {
  interest = principal * rate * years;
}

document.getElementById("interest").innerText = interest.toFixed(0);
document.getElementById("monthly").innerText = (interest/12).toFixed(0);
document.getElementById("totalYear").innerText = (principal+interest).toFixed(0);

}

function addEntry(){

let record = {
principal: document.getElementById("principal").value,
type: document.getElementById("type").value,
interest: document.getElementById("interest").innerText,
total: document.getElementById("totalYear").innerText
};

data.push(record);
render();

}

function render(){

let table = document.getElementById("table");
table.innerHTML="";

let totalInvest=0,totalInterest=0,totalReturn=0;

data.forEach((r,i)=>{
table.innerHTML += `
<tr>
<td>${r.principal}L</td>
<td>${r.type}</td>
<td>${r.interest}</td>
<td>${r.total}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`;

totalInvest += r.principal*100000;
totalInterest += parseFloat(r.interest);
totalReturn += parseFloat(r.total);

});

document.getElementById("totalInvest").innerText = totalInvest.toFixed(0);
document.getElementById("totalInterest").innerText = totalInterest.toFixed(0);
document.getElementById("totalReturn").innerText = totalReturn.toFixed(0);

}

function del(i){
data.splice(i,1);
render();
}

function exportData(){

let csv="Principal,Type,Interest,Total\n";
data.forEach(r=>{
csv+=`${r.principal},${r.type},${r.interest},${r.total}\n`;
});

let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="data.csv";
a.click();

}

</script>

</body>
</html>
