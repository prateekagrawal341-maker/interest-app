<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interest Calculator</title>

<style>
body {
  font-family: 'Segoe UI';
  background: #f1f5f9;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: auto;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}
input, select {
  padding: 10px;
  width: 100%;
}
button {
  padding: 10px;
  margin-top: 10px;
  background: blue;
  color: white;
  border: none;
}
.result {
  background: #eef;
  padding: 10px;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 10px;
  border: 1px solid #ccc;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h2>Interest Calculator</h2>

<div class="card">
<div class="grid">

<div>
<label>Lending Date</label>
<input type="date" id="start">
</div>

<div>
<label>Return Date</label>
<input type="date" id="end">
</div>

<div>
<label>Principal (Lakhs)</label>
<input type="number" id="principal">
</div>

<div>
<label>Interest Rate</label>
<select id="rate">
<option value="0.12">12%</option>
<option value="0.18">18%</option>
<option value="0.24">24%</option>
</select>
</div>

<div>
<label>Interest Type</label>
<select id="type">
<option value="simple">Simple Interest</option>
<option value="compound">Compound Interest</option>
</select>
</div>

<div class="result">Interest: ₹ <span id="interest">0</span></div>
<div class="result">Monthly: ₹ <span id="monthly">0</span></div>
<div class="result">Total: ₹ <span id="totalYear">0</span></div>

</div>

<button onclick="calculate()">Calculate</button>
<button onclick="addEntry()">Add / Update</button>
</div>

<div class="card">
<h3>Loan Records</h3>
<button onclick="exportToExcel()">Export</button>

<table id="ledgerTable">
<thead>
<tr>
<th>Start</th>
<th>End</th>
<th>Principal</th>
<th>Rate</th>
<th>Type</th>
<th>Interest</th>
<th>Total</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script>

let records = [];
let editIndex = -1;

function calculate() {

  let startVal = start.value;
  let endVal = end.value;

  if (!startVal || !endVal) return alert("Select dates");

  let days = (new Date(endVal) - new Date(startVal)) / (1000*60*60*24);
  if (days <= 0) return alert("Invalid date");

  let years = days / 365;

  let input = principal.value.trim();
  if (!input) return alert("Enter principal");

  let p = parseFloat(input);
  if (isNaN(p) || p <= 0) return alert("Invalid principal");

  let principalAmt = p * 100000;
  let rate = parseFloat(rateEl.value);
  let type = document.getElementById("type").value;

  let interest;

  if (type === "compound") {
    let amount = principalAmt * Math.pow((1 + rate), years);
    interest = amount - principalAmt;
  } else {
    interest = principalAmt * rate * years;
  }

  let monthly = interest / 12;
  let total = principalAmt + interest;

  interestEl.innerText = interest.toFixed(0);
  monthlyEl.innerText = monthly.toFixed(0);
  totalYear.innerText = total.toFixed(0);
}

function addEntry() {

  if (interestEl.innerText === "0") return alert("Calculate first");

  let record = {
    start: start.value,
    end: end.value,
    principal: principal.value,
    rate: rateEl.value,
    type: document.getElementById("type").value,
    interest: interestEl.innerText,
    total: totalYear.innerText
  };

  if (editIndex === -1) records.push(record);
  else { records[editIndex] = record; editIndex = -1; }

  renderTable();
}

function renderTable() {
  let tbody = document.querySelector("#ledgerTable tbody");
  tbody.innerHTML = "";

  records.forEach((r,i) => {
    tbody.innerHTML += `
    <tr>
      <td>${r.start}</td>
      <td>${r.end}</td>
      <td>${r.principal} L</td>
      <td>${r.rate*100}%</td>
      <td>${r.type}</td>
      <td>${r.interest}</td>
      <td>${r.total}</td>
      <td>
        <button onclick="editRow(${i})">Edit</button>
        <button onclick="deleteRow(${i})">Delete</button>
      </td>
    </tr>`;
  });
}

function deleteRow(i) {
  records.splice(i,1);
  renderTable();
}

function editRow(i) {
  let r = records[i];
  start.value = r.start;
  end.value = r.end;
  principal.value = r.principal;
  rateEl.value = r.rate;
  document.getElementById("type").value = r.type;

  interestEl.innerText = r.interest;
  totalYear.innerText = r.total;

  editIndex = i;
}

function exportToExcel() {
  let csv = "Start,End,Principal,Rate,Type,Interest,Total\n";
  records.forEach(r=>{
    csv += `${r.start},${r.end},${r.principal},${r.rate*100},${r.type},${r.interest},${r.total}\n`;
  });

  let blob = new Blob([csv]);
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "data.csv";
  a.click();
}

// shortcuts
let interestEl = document.getElementById("interest");
let monthlyEl = document.getElementById("monthly");
let totalYear = document.getElementById("totalYear");
let rateEl = document.getElementById("rate");

</script>

</body>
</html>
