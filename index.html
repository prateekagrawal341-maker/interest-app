<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Tracker</title>

<style>
body {
  font-family: 'Segoe UI';
  background: #0f172a;
  color: white;
  margin: 0;
}

.header {
  background: linear-gradient(135deg,#2563eb,#9333ea);
  padding: 16px;
  text-align: center;
  font-weight: bold;
}

.container {
  padding: 15px;
  padding-bottom: 100px;
}

.card {
  background: #1e293b;
  padding: 16px;
  border-radius: 16px;
  margin-bottom: 16px;
}

label {
  font-size: 13px;
  color: #94a3b8;
  margin-top: 10px;
  display: block;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #2563eb;
  color: white;
}

table {
  width:100%;
  border-collapse: collapse;
}

th, td {
  padding:8px;
  border-bottom:1px solid #334155;
  text-align:center;
}

table button {
  width:auto;
  padding:6px 10px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

.stat {
  background: #2563eb;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  background: #1e293b;
  border-top: 1px solid #334155;
}

.nav button {
  flex:1;
  background:none;
  border:none;
  color:#cbd5f5;
  padding:12px 0;
}

.nav button.active {
  color:white;
}
</style>
</head>

<body>

<div class="header">Finance Tracker</div>

<div class="container">

<!-- HOME -->
<div id="home">

<div class="card">

<label>Name</label>
<input type="text" id="name">

<label>Start Date</label>
<input type="date" id="start">

<label>End Date</label>
<input type="date" id="end">

<label>Principal (Lakhs)</label>
<input type="number" id="principal">

<label>Rate</label>
<select id="rate">
<option value="0.12">12%</option>
<option value="0.18">18%</option>
<option value="0.24">24%</option>
</select>

<label>Type</label>
<select id="type">
<option value="simple">Simple</option>
<option value="compound">Compound</option>
</select>

<label>Status</label>
<select id="status">
<option value="pending">Pending</option>
<option value="paid">Paid</option>
</select>

<button onclick="calculate()">Calculate</button>
<button onclick="saveEntry()">Add / Update</button>

</div>

<div class="card">
Interest ₹ <span id="interest">0</span><br>
Monthly ₹ <span id="monthly">0</span><br>
Total ₹ <span id="total">0</span>
</div>

</div>

<!-- RECORDS -->
<div id="records" style="display:none">
<div class="card">

<button onclick="exportData()">Export to Excel</button>

<table>
<thead>
<tr>
<th>Name</th><th>P</th><th>Type</th><th>Status</th><th>Total</th><th>X</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>
</div>

<!-- SUMMARY -->
<div id="summary" style="display:none">

<div class="stats">
<div class="stat">Invest ₹ <span id="totalInvest">0</span></div>
<div class="stat">Return ₹ <span id="totalReturn">0</span></div>
<div class="stat">Pending ₹ <span id="pendingAmt">0</span></div>
<div class="stat">Paid ₹ <span id="paidAmt">0</span></div>
</div>

</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="showPage('home',this)" class="active">Home</button>
<button onclick="showPage('records',this)">Records</button>
<button onclick="showPage('summary',this)">Summary</button>
</div>

<script>

let data = JSON.parse(localStorage.getItem("financeData")) || [];
let editIndex = -1;

function saveData(){
localStorage.setItem("financeData", JSON.stringify(data));
}

function showPage(page,btn){
["home","records","summary"].forEach(p=>{
document.getElementById(p).style.display="none";
});
document.getElementById(page).style.display="block";

document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
}

function calculate(){

let p = parseFloat(document.getElementById("principal").value || 0);
let rate = parseFloat(document.getElementById("rate").value);
let type = document.getElementById("type").value;

let start = new Date(document.getElementById("start").value);
let end = new Date(document.getElementById("end").value);

let years = (end - start) / (1000*60*60*24*365);
if(isNaN(years) || years <= 0) return alert("Invalid dates");

let principalAmt = p * 100000;
let interest;

if(type === "compound"){
interest = principalAmt * Math.pow(1 + rate, years) - principalAmt;
}else{
interest = principalAmt * rate * years;
}

let monthly = years > 0 ? interest / (years * 12) : 0;

document.getElementById("interest").innerText = interest.toFixed(0);
document.getElementById("monthly").innerText = monthly.toFixed(0);
document.getElementById("total").innerText = (principalAmt + interest).toFixed(0);
}

function saveEntry(){

let record = {
name: document.getElementById("name").value || "No Name",
principal: parseFloat(document.getElementById("principal").value || 0),
type: document.getElementById("type").value,
status: document.getElementById("status").value,
total: parseFloat(document.getElementById("total").innerText || 0)
};

if(editIndex === -1){
data.push(record);
}else{
data[editIndex] = record;
editIndex = -1;
}

saveData();
render();

document.getElementById("name").value = "";
document.getElementById("principal").value = "";
document.getElementById("start").value = "";
document.getElementById("end").value = "";

alert("Saved successfully");
}

function render(){

let table = document.getElementById("table");
table.innerHTML = "";

let ti=0,tr=0,pending=0,paid=0;

data.forEach((r,i)=>{

table.innerHTML += `
<tr>
<td>${r.name}</td>
<td>${r.principal}</td>
<td>${r.type}</td>
<td>${r.status}</td>
<td>${r.total}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`;

ti += r.principal * 100000;
tr += r.total;

if(r.status === "pending") pending += r.total;
else paid += r.total;
});

totalInvest.innerText = ti.toFixed(0);
totalReturn.innerText = tr.toFixed(0);
pendingAmt.innerText = pending.toFixed(0);
paidAmt.innerText = paid.toFixed(0);
}

function del(i){
data.splice(i,1);
saveData();
render();
}

function exportData(){

let csv = "Name,Principal,Type,Status,Total\n";

data.forEach(r=>{
csv += `${r.name},${r.principal},${r.type},${r.status},${r.total}\n`;
});

let blob = new Blob([csv], {type: "text/csv"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "finance-data.csv";
a.click();
}

render();

</script>

</body>
</html>
